name: Build and Push Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_WEB: leviabowles/farm-db-web
  IMAGE_NAME_FRONTEND: leviabowles/farm-db-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Filesystem
        run: |
          echo "Current working directory: $(pwd)"
          echo "Listing root files:"
          ls -la
          echo "Checking Dockerfile.web specifically:"
          ls -l Dockerfile.web || echo "NOT FOUND"
          echo "Contents of Dockerfile.web:"
          cat Dockerfile.web || echo "CANNOT READ"
          echo "Checking react-frontend directory:"
          ls -la react-frontend || echo "NOT FOUND"
          ls -l react-frontend/Dockerfile || echo "NOT FOUND"
          echo "Contents of react-frontend/Dockerfile:"
          cat react-frontend/Dockerfile || echo "CANNOT READ"
          echo "---------------------------------------"

      - name: Build and push Frontend image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest -f react-frontend/Dockerfile ./react-frontend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

