version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: farm-db-web-prod
    ports:
      - "8000:8000"
    environment:
      - DB=${DB_NAME}
      - DBUSER=${DB_USER}
      - DBPW=${DB_PASSWORD}
      - DBHOST=${DB_HOST}
    restart: unless-stopped

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: farm-db-frontend-prod
    ports:
      - "3000:3000"
      - "80:80"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    depends_on:
      - web
    restart: unless-stopped
