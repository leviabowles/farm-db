name: Deploy to Home Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to local environment
        run: |
          # Create .env file the GitHub Secrets
          echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env

          # Move the project to /tmp for Docker access
          mkdir -p /tmp/farm-db-deploy
          cp -R . /tmp/farm-db-deploy
          cd /tmp/farm-db-deploy
          
          echo "--- DEBUG: Verifying files in deployment directory ---"
          ls -la
          ls -d react-frontend || echo "REACT-FRONTEND FOLDER MISSING"
          find . -maxdepth 2 -not -path '*/.*'
          echo "------------------------------------------------------"

          docker compose -f docker-compose.prod.yml up -d --build web frontend
          docker image prune -f
          
          # Cleanup temporary deployment directory
          rm -rf /tmp/farm-db-deploy
