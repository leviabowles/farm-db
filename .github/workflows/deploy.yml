name: Deploy to Home Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to local environment
        run: |
          # Navigate to the app directory (assuming runner is installed in home)
          cd ~/farm-db
          
          # Dynamically create .env file from GitHub Secrets
          echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env

          # Update the code from GitHub - force match remote to avoid local conflicts
          git fetch origin main
          git reset --hard origin/main
          
          # Restart only the web and frontend services using the prod config
          docker compose -f docker-compose.prod.yml up -d --build web frontend
          docker image prune -f
