name: Deploy to Home Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to local environment
        run: |
          # Create .env file the GitHub Secrets
          echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env

          # Log in to GHCR on the home server
          # We use a token from secrets since GITHUB_TOKEN might not have pull access for private packages on self-hosted runners
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull latest images from registry
          docker compose -f docker-compose.prod.yml pull

          # Restart services using the fresh images
          docker compose -f docker-compose.prod.yml up -d
          
          # Cleanup old images
          docker image prune -f

