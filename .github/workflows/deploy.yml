name: Deploy to Home Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to local environment
        run: |
          # Create .env file the GitHub Secrets
          echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env

          # Move the project to /tmp for Docker access, excluding the .git folder 
          # to avoid permission issues and reduce context size.
          mkdir -p /tmp/farm-db-deploy
          tar -C . --exclude='.git' -cf - . | tar -C /tmp/farm-db-deploy -xf -
          cd /tmp/farm-db-deploy

          # Build images manually with explicit Dockerfile paths
          docker build -t farm-db-web:latest -f Dockerfile.web .
          docker build -t farm-db-frontend:latest -f react-frontend/Dockerfile ./react-frontend
          
          # Restart services using the pre-built images
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
          
          # Cleanup temporary deployment directory
          rm -rf /tmp/farm-db-deploy
